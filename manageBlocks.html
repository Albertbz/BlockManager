<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <link rel="stylesheet" href="./style.css">
    <script src="./glmatrix/gl-matrix-min.js"></script>
    <script src="./blockPreview.js" type="module"></script>
    <title>Block Manager for cyubeVR</title>
</head>

<body class="page-entering">
    <div class="container box">
        <h1 class="text-center header outline mb-1 blur w-fit align-center no-select">Manage Blocks</h1>
        <div class="content box">
            <div class="header box blocks-panel align-center blur">

                <div class="filter header box-horizontal">
                    <div class="left">
                        <button type="button" class="btn me-1 btn-pressed filter-btn" id="filterAll"
                            title="Show all blocks">All</button>
                        <button type="button" class="btn me-1 filter-btn"
                            title="Show only blocks that are not part of a mod">Independent</button>
                        <button type="button" class="btn me-1 filter-btn"
                            title="Show only blocks that are part of a mod">Mods</button>
                        <!-- Game version choice, only shown when filtering by mods -->
                        <select class="version-select d-none" id="versionSelect"></select>
                    </div>
                    <div class="right">
                        <button type="button" class="btn sort-button category-toggle me-1" id="categoryToggle"
                            title="Group blocks by category">
                            <img src="./images/categories.png" alt="Group by category" class="sort-img">
                        </button>

                        <div class="dropdown">
                            <button type="button" class="btn sort-button me-1" id="sortButton" title="Sort by">
                                <img src="./images/sort.png" alt="Sort by" class="sort-img">
                            </button>
                            <div class="dropdown-content d-none" id="dropdownContent">
                                <p class="sort-text sort-header outline">Sort by</p>
                                <button type="button" class="btn btn-fill h-22 sort-type-btn">
                                    <p class="sort-text">Name</p>
                                    <img class="sort-arrow" src="./images/sort-down-arrow.png" alt="">
                                </button>
                                <button type="button" class="btn btn-fill h-22 sort-type-btn">
                                    <p class="sort-text">ID</p>
                                </button>
                            </div>
                        </div>
    
                        <button type="button" class="btn search-btn" id="searchButton" title="Search by name">
                            <img src="./images/search.png" alt="Search" class="search-img">
                        </button>
                    </div>
                </div>
    
                <div class="box blocks" id="blocksDiv"></div>
            </div>


        </div>

        <div class="footer btns no-select">
            <span class="left"></span>
            <span class="center blur blur-circle">
                <button class="btn btn-large add-btn" type="button" id="makeNewBlock"
                    title="Create a new block">
                    <img class="add-img" src="./images/add.png" alt="">
                </button>
            </span>
            <span class="right"></span>
        </div>
    </div>
</body>

<script src="./manageBlocks.js" type="module"></script>

</html>
